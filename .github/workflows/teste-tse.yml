name: Teste de acesso ao TSE
on:
  push:
    paths: [".github/workflows/teste-tse.yml"]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/brmun.py 6257 /tmp/t.json
          python3 -c "import json,sys;m=json.load(open('/tmp/t.json'))['m'];print(len(m));sys.exit(0 if len(m)>5500 and sum(v[1] for v in m.values())>50000000 else 1)"
