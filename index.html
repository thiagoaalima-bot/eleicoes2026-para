<style>
:root{--bg:#EEF2EF;--ink:#16231F;--muted:#5C6B66;--line:#C9D3CE;--panel:#FFFFFF;--soft:#F4F7F5;--lula:#C2413B;--flavio:#2F4E9E;--up:#1E7F4F;--down:#B23B3B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101917;--ink:#E6EEEA;--muted:#93A39D;--line:#2B3935;--panel:#18241F;--soft:#1E2B26;--up:#4CC38A;--down:#F07A72}}
:root[data-theme="dark"]{--bg:#101917;--ink:#E6EEEA;--muted:#93A39D;--line:#2B3935;--panel:#18241F;--soft:#1E2B26;--up:#4CC38A;--down:#F07A72}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-stretch:70%;font-weight:800;font-size:clamp(1.9rem,6vw,3rem);line-height:1;margin:0}
.st{color:var(--muted);font-size:.85rem}
.card{background:var(--panel);border-radius:14px;padding:14px}
.seg{display:inline-flex;gap:4px;background:var(--panel);padding:4px;border-radius:12px}
.seg button,.chips button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.srch{position:relative;flex:1 1 220px;min-width:0}
.srch input{width:100%;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px}
.sug{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sug div{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sug div:hover,.sug div.on{background:var(--soft)}
.sug small{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.crumb{display:flex;gap:4px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-bottom:2px}
.crumb a{color:var(--muted);text-decoration:underline;cursor:pointer}
h2{font-stretch:75%;font-weight:800;font-size:1.7rem;line-height:1.05;margin:0 0 4px}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.cd{border-radius:12px;padding:10px;background:var(--soft);border-top:4px solid var(--c)}
.cd .hd{display:flex;align-items:center;gap:8px}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid var(--c);background:var(--line);flex:none}
.cd b{display:block;font-size:.95rem;line-height:1.1}
.cd .tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 5px;margin-top:2px}
.cd .big{font-stretch:72%;font-weight:800;font-size:2.1rem;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.cd .vt{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cd .dl{font-size:.82rem;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.lead{font-size:.9rem;margin:2px 0 10px}
table.cmp{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.cmp th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:right;padding:4px 4px 6px;border-bottom:1px solid var(--line)}
.cmp th:first-child{text-align:left}
.cmp td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.cmp td:first-child{text-align:left;font-weight:600}
.cmp td small{display:block;color:var(--muted);font-size:.75rem;font-weight:400}
.cmp tr.sep td{border-top:2px solid var(--line)}
.cmp .chip{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mapc{position:relative}
.mapc svg{width:100%;height:auto;display:block;touch-action:manipulation}
.mtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;max-width:260px;z-index:5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-radius:999px;padding:2px 8px;margin:-2px -8px}
.legend span:hover{background:var(--soft)}
.legend.on span:not(.on){opacity:.4}
.legend span.on{font-weight:700;background:var(--soft)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .c{color:var(--muted)}
.grad{cursor:default!important;width:100%}
.grad i{flex:1;height:10px;border-radius:5px;max-width:260px}
path.u{stroke:var(--panel);stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}
path.uo{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:.9;vector-effect:non-scaling-stroke;pointer-events:none}
.mun path{stroke:var(--panel);stroke-width:.15;vector-effect:non-scaling-stroke;cursor:pointer}
.zoomed .mun path{stroke-width:.5}
path.off,circle.off{opacity:.12}
path.out{opacity:.25}
path.sel,circle.sel{stroke:var(--ink)!important;stroke-width:2.2!important}
text.ufl{font-size:11px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none}
.zoomed text.ufl{display:none}
.mapc.mu text.ufl{font-size:9px;opacity:.8}
path.w{fill:var(--line);stroke:var(--panel);stroke-width:.4;vector-effect:non-scaling-stroke}
path.w.m{cursor:pointer}
circle.dot{stroke:var(--panel);stroke-width:1;cursor:pointer}
.load{position:absolute;inset:auto 0 45% 0;margin:auto;width:max-content;max-width:80%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem}
.rank{margin-top:14px}
.rank .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rank h3{margin:0;font-size:1rem}
.rk{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
.rk th{font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:right;padding:4px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.rk th:first-child{text-align:left}
.rk th[aria-sort]{color:var(--ink)}
.rk td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.rk td:first-child{text-align:left}
.rk tr{cursor:pointer}.rk tbody tr:hover{background:var(--soft)}
.rk .w{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.rkw{max-height:520px;overflow:auto}
.more{font:inherit;margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.btn{font:inherit;font-weight:700;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 16px;cursor:pointer}
.btn.lt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.gw{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.gw p{margin:0 0 8px;font-weight:700;font-size:.95rem}
.gwg{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;max-width:340px}
.gwg i{aspect-ratio:1;border-radius:2px}
.gwl{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.ler{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:.88rem}
.ler h3{font-size:1rem;margin:0 0 6px}
.ler p{margin:0 0 7px}
.ler .obs{color:var(--muted);font-size:.78rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
footer{color:var(--muted);font-size:.78rem;margin-top:22px}
footer a{color:var(--muted)}
@media (max-width:520px){h2{font-size:1.45rem}.cd .big{font-size:1.75rem}.cmp{font-size:.8rem}.cmp td small{font-size:.7rem}.hide-s{display:none}}
</style>
</head>
<body>
<main>
<header><h1>Presidente 2026</h1><span class="st" id="st">Carregando…</span></header>
<div class="bar">
  <div class="seg" role="group" aria-label="Onde"><button data-esc="br" aria-pressed="true">Brasil</button><button data-esc="ex" aria-pressed="false">Exterior</button></div>
  <div class="srch"><input id="q" type="search" placeholder="Buscar estado, município ou país" autocomplete="off" aria-label="Buscar estado, município ou país"><div class="sug" id="sug" hidden></div></div>
</div>
<div class="grid">
  <section class="card" id="res" aria-live="polite"></section>
  <section class="card">
    <div class="mtop"><div class="seg" id="geo" role="group" aria-label="Divisão do mapa"><button data-geo="uf" aria-pressed="true">Estados</button><button data-geo="mu" aria-pressed="false">Municípios</button></div>
      <div class="chips" id="modo" role="group" aria-label="O que o mapa mostra"><button data-m="venc" aria-pressed="true">Vencedor</button><button data-m="vir" aria-pressed="false">Viradas</button><button data-m="gan" aria-pressed="false">Quem cresceu mais</button></div></div>
    <div class="mapc" id="mapc"><svg id="map"></svg><div class="tip" id="tip"></div><p class="load" id="load" hidden></p></div>
    <div class="legend" id="leg"></div>
  </section>
</div>
<section class="card rank" id="rank"></section>
<footer>Fonte: TSE, totalização do 1º turno (4/10/2026) e do 2º turno (25/10/2026). Percentuais de candidatos sobre os votos válidos; brancos, nulos e válidos sobre o comparecimento; comparecimento e abstenção sobre os eleitores aptos. <a href="antigo.html">Versão anterior do site</a></footer>

function av(nr){const f=FOT[nr];return f?`<img class="av" alt="" src="data:image/jpeg;base64,${f}">`:`<span class="av"></span>`;}
function cell(n,p){return `${big(n)}${p!=null?`<small>${pf(p)}</small>`:''}`;}
function dcell(dn,dp,neu){const c=neu?'':dn>0?'up':dn<0?'down':'';return `<span class="${c}">${dn>=1e6||dn<=-1e6?(dn>0?'+':'−')+big(Math.abs(dn)):sv(dn)}</span>${dp!=null?`<small class="${neu?'':dp>0?'up':dp<0?'down':''}">${pp(dp)}</small>`:''}`;}
function renderRes(){if(!P)return;const k=S.sel,r=cmp(k),el=document.getElementById('res');
  const cr=[];let p=pai(k);while(p){cr.unshift(p);p=pai(p);}
  const crumb=cr.length?`<div class="crumb">${cr.map(c=>`<a data-go="${c}">${esc(nome(c))}</a> ›`).join(' ')}</div>`:'';
  if(!r){el.innerHTML=crumb+`<h2>${esc(nome(k))}</h2><p class="sub">Sem votos apurados aqui.</p>`;return;}
  const a=r.a,b=r.b,w=r.w2,lo=w===L?F:L,dif=Math.abs(r.L2-r.F2);
  const cd=nr=>{const v1=nr===L?r.L1:r.F1,v2=nr===L?r.L2:r.F2,p1=nr===L?r.l1:r.f1,p2=nr===L?r.l2:r.f2,c=CN[nr].c;
    return `<div class="cd" style="--c:${c}"><div class="hd">${av(nr)}<div><b>${CN[nr].n}</b>${nr===w?'<span class="tag">venceu</span>':''}</div></div>
      <div class="big">${pf(p2)}</div><div class="vt">${fmt.format(v2)} votos</div>
      <div class="dl ${v2-v1>=0?'up':'down'}">${sv(v2-v1)} votos · ${pp(p2-p1)}</div><div class="vt">1º turno: ${pf(p1)}</div></div>`;};
  const row=(lab,c,n1,p1,n2,p2,isP)=>`<tr><td>${c?`<i class="chip" style="background:${c}"></i>`:''}${lab}</td><td>${n1==null?'–':cell(n1,p1)}</td><td>${n2==null?'–':cell(n2,p2)}</td><td>${n1==null||n2==null?'–':dcell(n2-n1,isP?p2-p1:null,!c)}</td></tr>`;
  el.innerHTML=crumb+`<h2>${esc(nome(k))}</h2><p class="sub">${k.startsWith('PA:')||k==='UF:ZZ'?'Brasileiros que votam no exterior · ':''}${fmt.format(b.ap)} eleitores aptos</p>
    <div class="duo">${cd(L)}${cd(F)}</div>
    <p class="lead"><b>${CN[w].n}</b> ${r.flip?'virou e ':''}venceu por <b>${fmt.format(dif)} votos</b> (${pp(Math.abs(r.l2-r.f2)).replace('+','')}).${r.flip?` No 1º turno, ${CN[r.w1].n} estava na frente.`:''}</p>
    <table class="cmp"><thead><tr><th></th><th>1º turno</th><th>2º turno</th><th>Variação</th></tr></thead><tbody>
    ${row('Lula',CN[L].c,r.L1,r.l1,r.L2,r.l2,1)}${row('Flávio',CN[F].c,r.F1,r.f1,r.F2,r.f2,1)}${row('Outros candidatos','#9AA6A1',r.O1,r.O1/(a.vv||1),null,null)}
    <tr class="sep"><td colspan="4" style="padding:0"></td></tr>
    ${row('Votos válidos',null,a.vv,a.vv/(a.co||1),b.vv,b.vv/(b.co||1),1)}${row('Brancos',null,a.vb,a.vb/(a.co||1),b.vb,b.vb/(b.co||1),1)}${row('Nulos',null,a.vn,a.vn/(a.co||1),b.vn,b.vn/(b.co||1),1)}
    ${row('Comparecimento',null,a.co,a.co/(a.ap||1),b.co,b.co/(b.ap||1),1)}${row('Abstenção',null,a.ab,a.ab/(a.ap||1),b.ab,b.ab/(b.ap||1),1)}
    </tbody></table>${leitura(r,k)}
    <div class="acts"><button class="btn" data-share>Compartilhar imagem</button>${k!=='BR'&&k!=='UF:ZZ'?`<button class="btn lt" data-go="${pai(k)||'BR'}">Voltar</button>`:''}</div>`;}
// leitura didática: de onde vieram os votos e como isso decidiu a eleição neste lugar
function leitura(r,k){const a=r.a,b=r.b,dC=b.co-a.co,dB=b.vb-a.vb,dN=b.vn-a.vn,dV=b.vv-a.vv,O=r.O1,T=r.gL+r.gF;if(!a.vv||!b.vv)return '';
  const n=x=>big(Math.abs(x)),ond=k==='BR'?'no Brasil':k==='UF:ZZ'?'no exterior':'aqui';
  const par=[];
  if(dC>=0)par.push(`<b>${n(dC)}</b> pessoas a mais foram votar`);else par.push(`<b>${n(dC)}</b> pessoas a menos foram votar`);
  par.push(dB<=0?`<b>${n(dB)}</b> votos deixaram de ser brancos`:`os brancos aumentaram <b>${n(dB)}</b>`);
  par.push(dN<=0?`<b>${n(dN)}</b> deixaram de ser nulos`:`os nulos aumentaram <b>${n(dN)}</b>`);
  const p1=`<p><b>1. Votos válidos ${dV>=0?'cresceram':'caíram'} ${n(dV)}</b> (de ${big(a.vv)} para ${big(b.vv)}): ${par.join('; ')}.</p>`;
  const p2=`<p><b>2. Votos em disputa entre os dois: ${big(T)}</b>. São os ${big(O)} votos dos outros candidatos no 1º turno ${dV>=0?'mais':'menos'} os ${n(dV)} ${dV>=0?'válidos novos':'válidos a menos'}.</p>`;
  const sh=x=>T>0?` (${Math.round(x/T*100)}%)`:'';
  const p3=`<p><b>3. Quem ficou com eles:</b> Lula ${sv(r.gL)} votos${r.gL>0?sh(r.gL):''}; Flávio ${sv(r.gF)} votos${r.gF>0?sh(r.gF):''}.</p>`;
  const m1=r.L1-r.F1,m2=r.L2-r.F2,w1=m1>=0?L:F,w2=m2>=0?L:F;
  const p4=`<p><b>4. Resultado:</b> no 1º turno, ${CN[w1].n} estava ${n(m1)} votos à frente; no 2º turno, ${CN[w2].n} venceu por ${n(m2)}.${w1!==w2?` Virou ${ond}.`:Math.abs(m2)>Math.abs(m1)?` A vantagem aumentou.`:` A vantagem diminuiu.`}</p>`;
  // quanto o perdedor precisaria dos votos em disputa para vencer
  const lo=w2===L?F:L,Lt1=lo===L?r.L1:r.F1,Wt1=lo===L?r.F1:r.L1,need=(Wt1-Lt1+T)/2,got=lo===L?r.gL:r.gF;let p5='';
  if(T>0){const sNeed=need/T;p5=sNeed>1?`<p><b>5.</b> Nem com todos os votos em disputa ${CN[lo].n} venceria ${ond}.</p>`:sNeed<=0?'':`<p><b>5.</b> Para ${CN[lo].n} vencer, precisaria de mais de ${big(Math.ceil(need))} desses votos (${Math.ceil(sNeed*100)}%). Ficou com ${big(Math.max(0,got))} (${Math.round(Math.max(0,got)/T*100)}%).</p>`;}
  return `<div class="ler"><h3>Como a eleição mudou ${ond}</h3>${p1}${p2}${p3}${p4}${p5}<p class="obs">São saldos: o voto é secreto, então não dá para saber o caminho de cada eleitor, só o resultado das trocas.</p></div>`;}
function gw(r){const gl=r.gL,gf=r.gF;if(gl<=0&&gf<=0)return '';
  if(gl<=0||gf<=0){const w=gl>0?L:F;return `<div class="gw"><p>Do 1º para o 2º turno, só ${CN[w].n} ganhou votos aqui.</p></div>`;}
  const a=Math.min(99,Math.max(1,Math.round(gl/(gl+gf)*100))),A=a>=50?L:F,na=A===L?a:100-a;
  const sq=Array.from({length:100},(_,i)=>`<i style="background:${CN[i<na?A:(A===L?F:L)].c}"></i>`).join('');
  return `<div class="gw"><p>De cada 100 votos que os dois ganharam no 2º turno, ${na} foram para ${CN[A].n}</p><div class="gwg" role="img" aria-label="${na} de 100 para ${CN[A].n}">${sq}</div>
    <div class="gwl"><span>Lula ${sv(gl)}</span><span>Flávio ${sv(gf)}</span></div></div>`;}

// ---------- mapa ----------
const W=600,H=600,svg=d3.select('#map'),tip=document.getElementById('tip');
let proj,path,gAll,gMun,gUF,gLab,gW,gDots,zk=null;
function drawMap(){svg.selectAll('*').remove();zk=null;
  if(S.esc==='br'){svg.attr('viewBox',`0 0 ${W} ${H}`);proj=d3.geoMercator().fitExtent([[6,6],[W-6,H-6]],UFGEO);path=d3.geoPath(proj);
    gAll=svg.append('g');gMun=gAll.append('g').attr('class','mun').append('g').attr('transform','scale(.1)');
    gUF=gAll.append('g').selectAll('path').data(UFGEO.features).join('path').attr('d',path).attr('class','u').attr('tabindex',0).attr('aria-label',f=>UFN[f.properties.sg])
      .on('mousemove',(e,f)=>tipShow(e,'UF:'+f.properties.sg)).on('mouseleave',tipHide).on('click',(e,f)=>go('UF:'+f.properties.sg))
      .on('keydown',(e,f)=>{if(e.key==='Enter')go('UF:'+f.properties.sg);});
    gLab=gAll.append('g').selectAll('text').data(UFGEO.features).join('text').attr('class','ufl').attr('x',f=>path.centroid(f)[0]).attr('y',f=>path.centroid(f)[1]).text(f=>f.properties.sg);
    if(S.geo==='mu')loadMun();}
  else{const MW=960,MH=490;svg.attr('viewBox',`0 0 ${MW} ${MH}`);proj=d3.geoNaturalEarth1().fitExtent([[4,4],[MW-4,MH-4]],WGEO);path=d3.geoPath(proj);
    gAll=svg.append('g');gW=gAll.append('g').selectAll('path').data(WGEO.features).join('path').attr('d',path).attr('class',f=>'w'+(CIT[f.properties.a3]?' m':''))
      .on('mousemove',(e,f)=>CIT[f.properties.a3]&&tipShow(e,'PA:'+f.properties.a3)).on('mouseleave',tipHide).on('click',(e,f)=>{if(CIT[f.properties.a3])go('PA:'+f.properties.a3);});
    gDots=gAll.append('g').selectAll('circle').data(Object.keys(WD.pt).filter(a=>CIT[a])).join('circle').attr('class','dot').attr('r',4.5)
      .attr('cx',a=>proj(WD.pt[a])[0]).attr('cy',a=>proj(WD.pt[a])[1]).on('mousemove',(e,a)=>tipShow(e,'PA:'+a)).on('mouseleave',tipHide).on('click',(e,a)=>go('PA:'+a));}
  paint();}
async function loadMun(){const ld=document.getElementById('load');if(GEO){drawMun();return;}ld.hidden=false;ld.textContent='Carregando os 5.570 municípios…';
  try{GEO=await getJSON('brmun-geo.json');}catch(e){ld.textContent='Não foi possível carregar os municípios.';return;}ld.hidden=true;drawMun();paint();}
function drawMun(){if(S.esc!=='br'||S.geo!=='mu'||!GEO)return;
  gMun.selectAll('path').data(Object.keys(GEO).filter(k=>GEO[k][3])).join('path').attr('d',k=>GEO[k][3])
    .on('mousemove',(e,k)=>tipShow(e,'MU:'+k)).on('mouseleave',tipHide).on('click',(e,k)=>{const uf=GEO[k][0];go(selUF()===uf?'MU:'+k:'UF:'+uf);});}
function selUF(){if(S.sel.startsWith('UF:'))return S.sel.slice(3);if(S.sel.startsWith('MU:')){const c=S.sel.slice(3);return NOMES&&NOMES[c]?NOMES[c][0]:GEO&&GEO[c]?GEO[c][0]:null;}return null;}
// cor de cada lugar conforme o modo do mapa
function cat(key){const r=cmp(key);if(!r||!r.b.vv)return 'n';if(S.m==='vir')return r.flip?'f'+r.w2:'k'+r.w2;if(S.m==='gan')return 'g';return 'w'+r.w2;}
function fill(key){const r=cmp(key);if(!r||!r.b.vv)return mix(css('--muted'),.18);
  if(S.m==='venc'){const s=Math.min(r.mg/.3,1);return mix(CN[r.w2].c,.25+.75*s);}
  if(S.m==='vir')return r.flip?FLIP[r.w2]:mix(CN[r.w2].c,.18);
  const t=r.gs;return t>=.5?mix(CN[L].c,.12+.88*Math.min((t-.5)/.4,1)):mix(CN[F].c,.12+.88*Math.min((.5-t)/.4,1));}
function paint(){if(!P)return;const off=k=>S.lf&&cat(k)!==S.lf;
  if(S.esc==='br'){const mu=S.geo==='mu'&&GEO;d3.select('#mapc').classed('mu',S.geo==='mu');
    gUF.attr('class',mu?'uo':'u').attr('fill',f=>mu?'none':fill('UF:'+f.properties.sg)).classed('off',f=>!mu&&off('UF:'+f.properties.sg)).classed('sel',f=>S.sel==='UF:'+f.properties.sg);
    if(mu){const uf=selUF();
      gMun.selectAll('path').attr('fill',k=>fill('MU:'+k)).classed('off',k=>off('MU:'+k)).classed('out',k=>uf&&GEO[k][0]!==uf).classed('sel',k=>S.sel==='MU:'+k);
      gMun.selectAll('path.sel').raise();zoom(uf);}else{gMun.selectAll('path').remove();zoom(null);}}
  else{gW.style('fill',f=>CIT[f.properties.a3]?fill('PA:'+f.properties.a3):null).classed('off',f=>CIT[f.properties.a3]&&off('PA:'+f.properties.a3)).classed('sel',f=>S.sel==='PA:'+f.properties.a3);
    gDots.attr('fill',a=>fill('PA:'+a)).classed('off',a=>off('PA:'+a)).classed('sel',a=>S.sel==='PA:'+a);}
  legend();}
function zoom(uf){if(uf===zk||uf==='ZZ')return;zk=uf;let tr='translate(0,0) scale(1)';
  if(uf){const f=UFGEO.features.find(x=>x.properties.sg===uf);const [[x0,y0],[x1,y1]]=path.bounds(f),s=Math.min(16,.9/Math.max((x1-x0)/W,(y1-y0)/H));tr=`translate(${W/2-s*(x0+x1)/2},${H/2-s*(y0+y1)/2}) scale(${s})`;}
  svg.classed('zoomed',!!uf);(RM.matches?gAll:gAll.transition().duration(600)).attr('transform',tr);}
function keysMap(){if(S.esc==='ex')return Object.keys(CIT).filter(a=>WD.n[a]).map(a=>'PA:'+a);
  if(S.geo==='mu'&&GEO){const uf=selUF();return Object.keys(GEO).filter(k=>!uf||GEO[k][0]===uf).map(k=>'MU:'+k);}
  return Object.keys(UFN).filter(s=>s!=='ZZ').map(s=>'UF:'+s);}
function legend(){const el=document.getElementById('leg'),ks=keysMap(),cnt={};for(const k of ks){const c=cat(k);cnt[c]=(cnt[c]||0)+1;}
  const un=S.esc==='ex'?'países':S.geo==='mu'?'municípios':'estados';let it=[];
  if(S.m==='venc')it=[['w13',CN[L].c,'Lula'],['w22',CN[F].c,'Flávio']];
  if(S.m==='vir')it=[['f13',FLIP[L],'Virou para Lula'],['f22',FLIP[F],'Virou para Flávio'],['k13',mix(CN[L].c,.35),'Lula manteve'],['k22',mix(CN[F].c,.35),'Flávio manteve']];
  if(S.m==='gan'){el.className='legend';el.innerHTML=`<span class="grad"><small>Flávio ganhou mais</small><i style="background:linear-gradient(90deg,${CN[F].c},${mix(CN[F].c,.12)},${mix(CN[L].c,.12)},${CN[L].c})"></i><small>Lula ganhou mais</small></span>`;return;}
  if(S.lf&&!it.some(x=>x[0]===S.lf))S.lf=null;
  el.className='legend'+(S.lf?' on':'');el.innerHTML=it.filter(x=>cnt[x[0]]).map(([k,c,t])=>`<span data-lf="${k}" class="${S.lf===k?'on':''}" role="button" tabindex="0"><i style="background:${c}"></i>${t} <span class="c">${fmt.format(cnt[k])}</span></span>`).join('')+`<span class="c" style="cursor:default">${un}</span>`;}
function tipShow(e,key){const r=cmp(key),b=document.getElementById('mapc').getBoundingClientRect();
  tip.innerHTML=`<b>${esc(nome(key))}</b><br>${r&&r.b.vv?`Lula ${pf(r.l2)} (${pp(r.l2-r.l1)}) · Flávio ${pf(r.f2)} (${pp(r.f2-r.f1)})${r.flip?'<br>Virou':''}`:'sem votos'}`;
  tip.style.opacity=1;let x=e.clientX-b.left+12,y=e.clientY-b.top-40;if(x>b.width-250)x-=260;tip.style.left=x+'px';tip.style.top=Math.max(0,y)+'px';}
function tipHide(){tip.style.opacity=0;}

// ---------- ranking ----------
function renderRank(){const el=document.getElementById('rank'),k=S.sel;let base=k;
  if(k.startsWith('MU:'))base=pai(k);if(k.startsWith('PA:'))base='UF:ZZ';
  let ks=filhos(base);if(S.lf)ks=ks.filter(x=>cat(x)===S.lf);
  if(!ks.length){el.innerHTML=k.startsWith('UF:')&&!NOMES?'<p class="sub">Carregando municípios…</p>':'';el.hidden=!el.innerHTML;return;}el.hidden=false;
  const R=ks.map(x=>[x,cmp(x)]).filter(z=>z[1]&&z[1].b.vv);
  const val={n:z=>nome(z[0]),v:z=>z[1].b.vv,l:z=>z[1].l2,dl:z=>z[1].l2-z[1].l1,df:z=>z[1].f2-z[1].f1,g:z=>z[1].gs};
  const f=val[S.sort]||val.v;R.sort((a,b)=>{const A=f(a),B=f(b);return (typeof A==='string'?A.localeCompare(B):A-B)*S.dir;});
  const th=(id,t,cls)=>`<th data-sort="${id}" ${S.sort===id?`aria-sort="${S.dir>0?'ascending':'descending'}"`:''} class="${cls||''}">${t}${S.sort===id?(S.dir>0?' ↑':' ↓'):''}</th>`;
  const tit=base==='BR'?'Estados':base==='UF:ZZ'?'Países':'Municípios de '+nome(base);
  el.innerHTML=`<div class="hd"><h3>${tit} <span class="sub">(${R.length}${S.lf?', filtrados pela legenda':''})</span></h3><span class="sub">Toque no título da coluna para ordenar</span></div>
   <div class="rkw"><table class="rk"><thead><tr>${th('n','Nome')}${th('v','Votos válidos','hide-s')}${th('l','Lula 2º t.')}${th('dl','Var. Lula')}${th('df','Var. Flávio')}</tr></thead><tbody>
   ${R.slice(0,S.lim).map(([x,r])=>`<tr data-go="${x}" ${x===k?'style="background:var(--soft)"':''}><td><i class="w" style="background:${r.flip?FLIP[r.w2]:CN[r.w2].c}"></i>${esc(nome(x))}</td><td class="hide-s">${fmt.format(r.b.vv)}</td><td>${pf(r.l2)}</td><td class="${r.l2-r.l1>=0?'up':'down'}">${pp(r.l2-r.l1)}</td><td class="${r.f2-r.f1>=0?'up':'down'}">${pp(r.f2-r.f1)}</td></tr>`).join('')}
   </tbody></table></div>${R.length>S.lim?`<button class="more" data-more>Mostrar mais ${fmt.format(Math.min(200,R.length-S.lim))}</button>`:''}`;}

// ---------- navegação ----------
function go(key){if(!key)return;if(key.startsWith('PA:')||key==='UF:ZZ'){if(S.esc!=='ex'){S.esc='ex';S.lf=null;S.sel=key;syncBtns();drawMap();}}
  else if(S.esc!=='br'){S.esc='br';S.lf=null;S.sel=key;syncBtns();drawMap();}
  S.sel=key;S.lim=60;tipHide();saveHash();render();}
function render(){renderRes();paint();renderRank();}
function syncBtns(){document.querySelectorAll('[data-esc]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.esc===S.esc));
  document.getElementById('geo').hidden=S.esc!=='br';document.querySelectorAll('[data-geo]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.geo===S.geo));
  document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.m));}
function saveHash(){try{history.replaceState(null,'','#'+[S.sel.replace(':','-'),S.geo==='mu'?'mun':'',S.m!=='venc'?S.m:''].filter(Boolean).join('/'));}catch(e){}}
function lerHash(){const h=decodeURIComponent(location.hash.slice(1)).split('/');const k=(h[0]||'BR').replace('-',':');
  if(k==='BR'||/^(UF|MU|PA):/.test(k))S.sel=k;if(h.includes('mun'))S.geo='mu';for(const m of ['vir','gan'])if(h.includes(m))S.m=m;
  S.esc=S.sel.startsWith('PA:')||S.sel==='UF:ZZ'?'ex':'br';syncBtns();}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);if(innerWidth<860&&g.closest('#rank'))document.getElementById('res').scrollIntoView({behavior:RM.matches?'auto':'smooth'});return;}
  const b=e.target.closest('[data-esc]');if(b){S.esc=b.dataset.esc;S.lf=null;S.sel=S.esc==='ex'?'UF:ZZ':'BR';syncBtns();drawMap();saveHash();render();return;}
  const gg=e.target.closest('[data-geo]');if(gg){S.geo=gg.dataset.geo;S.lf=null;syncBtns();drawMap();saveHash();render();return;}
  const m=e.target.closest('[data-m]');if(m){S.m=m.dataset.m;S.lf=null;syncBtns();saveHash();render();return;}
  const lf=e.target.closest('[data-lf]');if(lf){S.lf=S.lf===lf.dataset.lf?null:lf.dataset.lf;render();return;}
  const so=e.target.closest('[data-sort]');if(so){if(S.sort===so.dataset.sort)S.dir*=-1;else{S.sort=so.dataset.sort;S.dir=so.dataset.sort==='n'?1:-1;}renderRank();return;}
  if(e.target.closest('[data-more]')){S.lim+=200;renderRank();return;}
  if(e.target.closest('[data-share]')){share(e.target.closest('[data-share]'));return;}});
// busca
const q=document.getElementById('q'),sug=document.getElementById('sug');let sugs=[],si=-1;
q.addEventListener('input',()=>{const t=norm(q.value.trim());if(t.length<2){sug.hidden=true;return;}
  const out=[];for(const s in UFN)if(norm(UFN[s]).includes(t)||norm(s)===t)out.push([s==='ZZ'?'UF:ZZ':'UF:'+s,UFN[s],'estado']);
  for(const a in CIT)if(WD.n[a]&&norm(WD.n[a]).includes(t))out.push(['PA:'+a,WD.n[a],'país']);
  if(NOMES){for(const c in NOMES){if(norm(NOMES[c][1]).startsWith(t))out.push(['MU:'+c,NOMES[c][1],NOMES[c][0]]);if(out.length>40)break;}
    if(out.length<20)for(const c in NOMES){if(!norm(NOMES[c][1]).startsWith(t)&&norm(NOMES[c][1]).includes(t))out.push(['MU:'+c,NOMES[c][1],NOMES[c][0]]);if(out.length>40)break;}}
  sugs=out.slice(0,30);si=-1;sug.innerHTML=sugs.map((s,i)=>`<div data-i="${i}"><span>${esc(s[1])}</span><small>${s[2]}</small></div>`).join('')||'<div><small>Nada encontrado</small></div>';sug.hidden=false;});
sug.addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();pick(+d.dataset.i);}});
q.addEventListener('keydown',e=>{if(sug.hidden)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){si=Math.max(0,Math.min(sugs.length-1,si+(e.key==='ArrowDown'?1:-1)));sug.querySelectorAll('[data-i]').forEach((d,i)=>d.classList.toggle('on',i===si));e.preventDefault();}
  if(e.key==='Enter'){pick(si<0?0:si);e.preventDefault();}if(e.key==='Escape')sug.hidden=true;});
q.addEventListener('blur',()=>setTimeout(()=>sug.hidden=true,150));
function pick(i){const s=sugs[i];if(!s)return;q.value='';sug.hidden=true;if(s[0].startsWith('MU:')&&S.geo!=='mu'){S.geo='mu';syncBtns();drawMap();}go(s[0]);}

// ---------- imagem para compartilhar ----------
function svgSnap(){const root=document.documentElement,prev=root.getAttribute('data-theme');root.setAttribute('data-theme','light');CACHE_CLEAR();paint();
  const sv=document.getElementById('map'),cl=sv.cloneNode(true),src=[sv,...sv.querySelectorAll('*')],dst=[cl,...cl.querySelectorAll('*')];
  const PR=['fill','stroke','stroke-width','stroke-opacity','opacity','display','font-size','font-weight','text-anchor','dominant-baseline','paint-order','vector-effect'];
  src.forEach((el,i)=>{const cs=getComputedStyle(el);let s='';for(const p of PR){const v=cs.getPropertyValue(p);if(v)s+=`${p}:${v};`;}dst[i].setAttribute('style',s);dst[i].removeAttribute('class');});
  cl.querySelectorAll('text').forEach(t=>t.setAttribute('font-family','Arial, sans-serif'));
  const leg=[...document.querySelectorAll('#leg [data-lf]')].map(x=>({c:getComputedStyle(x.querySelector('i')).backgroundColor,t:x.textContent.trim()}));
  if(prev===null)root.removeAttribute('data-theme');else root.setAttribute('data-theme',prev);paint();
  cl.setAttribute('xmlns','http://www.w3.org/2000/svg');const vb=sv.viewBox.baseVal;cl.setAttribute('width',vb.width);cl.setAttribute('height',vb.height);
  return {leg,w:vb.width,h:vb.height,url:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(cl))};}
function CACHE_CLEAR(){}
async function share(btn){const old=btn.textContent;btn.disabled=true;btn.textContent='Gerando imagem…';
  try{const r=cmp(S.sel),Wd=1080,Hd=1350,M=64,cv=document.createElement('canvas');cv.width=Wd;cv.height=Hd;const g=cv.getContext('2d');
    const Fn='"Archivo",system-ui,sans-serif';try{await document.fonts.load('800 60px Archivo');}catch(e){}
    const rr=(x,y,w,h,ra)=>{g.beginPath();g.moveTo(x+ra,y);g.arcTo(x+w,y,x+w,y+h,ra);g.arcTo(x+w,y+h,x,y+h,ra);g.arcTo(x,y+h,x,y,ra);g.arcTo(x,y,x+w,y,ra);g.closePath();g.fill();};
    const img=s=>new Promise(res=>{if(!s)return res(null);const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=s;});
    const INK='#16231F',MUT='#5C6B66';g.fillStyle='#F6F4EF';g.fillRect(0,0,Wd,Hd);
    g.fillStyle=INK;g.font=`800 44px ${Fn}`;g.fillText('Eleições 2026 · Presidente',M,96);
    g.font=`700 30px ${Fn}`;g.fillStyle=MUT;g.fillText(nome(S.sel).toUpperCase()+' · 1º E 2º TURNO',M,146);
    let y=180;const cw=(Wd-2*M-24)/2;
    for(const [i,nr] of [[0,L],[1,F]]){const x=M+i*(cw+24),c=CN[nr].c,v1=nr===L?r.L1:r.F1,v2=nr===L?r.L2:r.F2,p1=nr===L?r.l1:r.f1,p2=nr===L?r.l2:r.f2;
      g.fillStyle='#FFFFFF';rr(x,y,cw,300,18);g.fillStyle=c;rr(x,y,cw,10,5);
      const ph=await img(FOT[nr]?'data:image/jpeg;base64,'+FOT[nr]:null);if(ph){g.save();g.beginPath();g.arc(x+60,y+72,38,0,7);g.clip();const s=76/Math.min(ph.width,ph.height);g.drawImage(ph,x+60-ph.width*s/2,y+34,ph.width*s,ph.height*s);g.restore();}
      g.fillStyle=INK;g.font=`800 34px ${Fn}`;g.fillText(CN[nr].n,x+112,y+70);if(nr===r.w2){g.font=`800 20px ${Fn}`;g.fillStyle=INK;rr(x+112,y+84,100,28,5);g.fillStyle='#fff';g.fillText('VENCEU',x+122,y+105);}
      g.fillStyle=INK;g.font=`800 72px ${Fn}`;g.fillText(pf(p2),x+24,y+190);g.font=`500 26px ${Fn}`;g.fillStyle=MUT;g.fillText(`${fmt.format(v2)} votos`,x+24,y+230);
      g.font=`700 24px ${Fn}`;g.fillStyle=v2-v1>=0?'#1E7F4F':'#B23B3B';g.fillText(`${sv(v2-v1)} votos · ${pp(p2-p1)}`,x+24,y+268);g.font=`500 22px ${Fn}`;g.fillStyle=MUT;g.fillText(`1º turno: ${pf(p1)}`,x+24,y+290);}
    y+=350;g.font=`600 28px ${Fn}`;g.fillStyle=INK;const a=r.a,b=r.b;
    const lines=[`Válidos: ${big(a.vv)} → ${big(b.vv)}`,`Brancos: ${pf(a.vb/a.co)} → ${pf(b.vb/b.co)}   Nulos: ${pf(a.vn/a.co)} → ${pf(b.vn/b.co)}`,`Abstenção: ${pf(a.ab/a.ap)} → ${pf(b.ab/b.ap)}`];
    for(const l of lines){g.fillText(l,M,y);y+=42;}
    const sn=svgSnap(),mi=await img(sn.url),avail=Hd-y-130;if(mi){const s=Math.min((Wd-2*M)/sn.w,avail/sn.h),mw=sn.w*s,mh=sn.h*s;g.drawImage(mi,(Wd-mw)/2,y+10+(avail-mh)/2,mw,mh);}
    let lx=M;g.font=`500 24px ${Fn}`;for(const l of sn.leg){g.fillStyle=l.c;rr(lx,Hd-102,22,22,4);g.fillStyle=INK;g.fillText(l.t,lx+30,Hd-84);lx+=g.measureText(l.t).width+70;if(lx>Wd-200)break;}
    g.font=`400 22px ${Fn}`;g.fillStyle=MUT;g.fillText(`Fonte: TSE, totalização do 1º e do 2º turno. ${S.m==='vir'?'Mapa: viradas.':S.m==='gan'?'Mapa: quem ganhou mais votos.':'Mapa: vencedor do 2º turno.'}`,M,Hd-40);
    const blob=await new Promise(res=>cv.toBlob(res,'image/png')),fn=`eleicoes-2026-${norm(nome(S.sel)).replace(/[^a-z0-9]+/g,'-')}.png`,file=new File([blob],fn,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:fn});}catch(e){}}
    else{let done=false;if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){try{await dl.save({filename:fn,data:blob});done=true;}catch(e){done=e&&e.code==='declined';}}}
      if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();}}}
  catch(e){console.error(e);}btn.disabled=false;btn.textContent=old;}
init();
</script>
